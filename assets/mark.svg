<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="markTitle markDesc">
  <title id="markTitle">আমার ৬৪</title>
  <desc id="markDesc">An open khata (ledger) with ruled pages and a sewn spine, crossed by one red kantha running stitch that ends in two knots, and stamped with a red wax seal. Pure geometry: no text.</desc>

  <!-- the khata card -->
  <rect x="12" y="12" width="232" height="232" rx="28" fill="#f6efe1"/>
  <rect x="12" y="12" width="232" height="232" rx="28" fill="none" stroke="#1a2430" stroke-opacity="0.22" stroke-width="1.6"/>
  <rect x="24" y="24" width="208" height="208" rx="18" fill="none" stroke="#1a2430" stroke-opacity="0.10" stroke-width="1.2"/>

  <!-- the open ledger: two facing pages -->
  <rect x="52" y="62" width="70" height="132" rx="5" fill="#fffbf2" stroke="#1a2430" stroke-opacity="0.6" stroke-width="2"/>
  <rect x="134" y="62" width="70" height="132" rx="5" fill="#fffbf2" stroke="#1a2430" stroke-opacity="0.6" stroke-width="2"/>

  <!-- ruled hairlines, aligned across the gutter -->
  <g stroke="#1a2430" stroke-opacity="0.30" stroke-width="1.4">
    <path d="M62 86 H112 M62 108 H112 M62 130 H112 M62 152 H112 M62 174 H112"/>
    <path d="M144 86 H194 M144 108 H194 M144 130 H194 M144 152 H194 M144 174 H194"/>
  </g>

  <!-- sewn binding: spine band + stitching ticks -->
  <rect x="120" y="60" width="16" height="136" fill="#efe6d3"/>
  <line x1="122" y1="62" x2="122" y2="194" stroke="#1a2430" stroke-opacity="0.65" stroke-width="2"/>
  <line x1="134" y1="62" x2="134" y2="194" stroke="#1a2430" stroke-opacity="0.65" stroke-width="2"/>
  <g stroke="#1a2430" stroke-opacity="0.85" stroke-width="2.2" stroke-linecap="round">
    <line x1="122.5" y1="80" x2="133.5" y2="80"/>
    <line x1="122.5" y1="102" x2="133.5" y2="102"/>
    <line x1="122.5" y1="124" x2="133.5" y2="124"/>
    <line x1="122.5" y1="146" x2="133.5" y2="146"/>
    <line x1="122.5" y1="168" x2="133.5" y2="168"/>
  </g>

  <!-- one red thread: a running kantha stitch laid across the spread -->
  <path d="M58 168 Q 128 120 198 100"
        fill="none" stroke="#bb3a3a" stroke-width="4.6"
        stroke-linecap="round" stroke-dasharray="8 6"/>
  <!-- the two ends of the thread: matching knots -->
  <circle cx="58" cy="168" r="5.4" fill="#bb3a3a" stroke="#8d2626" stroke-width="1"/>
  <circle cx="198" cy="100" r="5.4" fill="#bb3a3a" stroke="#8d2626" stroke-width="1"/>

  <!-- a red wax seal, stamped across the foot of the binding -->
  <g>
    <circle cx="128" cy="198" r="20" fill="#a93a24"/>
    <circle cx="128" cy="198" r="13.5" fill="none" stroke="#fdf6e6" stroke-opacity="0.85" stroke-width="2"/>
    <circle cx="128" cy="198" r="7.5" fill="none" stroke="#fdf6e6" stroke-opacity="0.9" stroke-width="2.2"
            stroke-dasharray="3 3.2" stroke-linecap="round"/>
  </g>
</svg>
